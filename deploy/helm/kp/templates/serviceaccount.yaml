{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kp.serviceAccountName" . }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
# NO Role and NO RoleBinding, on purpose: kp calls no Kubernetes API, so the
# correct permission set is empty and inventing one would be inventing a
# requirement. NO TOKEN either — a projected API credential in a pod that holds
# candidate PII and spawns Python subprocesses on request buys nothing and costs
# a credential. deployment.yaml repeats this at pod level, which is the setting
# that binds when both exist (and covers serviceAccount.create=false).
automountServiceAccountToken: false
{{- end }}
