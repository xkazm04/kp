{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kp.fullname" . }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
type: Opaque
stringData:
  # required() fails the install with a clear message rather than deploying an OPEN,
  # unencrypted app. Set auth.operatorPassword + auth.secret, or use existingSecret.
  KP_OPERATOR_PASSWORD: {{ required "kp: auth.operatorPassword is required (or set existingSecret) — an empty operator password runs KP OPEN with no login" .Values.auth.operatorPassword | quote }}
  KP_SECRET: {{ required "kp: auth.secret is required (or set existingSecret) — it encrypts stored provider keys" .Values.auth.secret | quote }}
  {{- range $key, $val := .Values.providerKeys }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
