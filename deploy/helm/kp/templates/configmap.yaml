apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kp.fullname" . }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
data:
  # Pinned by the chart — the DB lives on the mounted volume, telemetry off.
  KP_DB_PATH: /data/kp.sqlite
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"
  {{- range $key, $val := .Values.env }}
  {{- if $val }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $val := .Values.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
