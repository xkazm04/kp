apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kp.fullname" . }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
spec:
  # HARD single replica + Recreate: SQLite is single-writer on a RWO volume, so a
  # rolling update (two pods briefly) would contend for one DB file. Recreate stops
  # the old pod before starting the new one. Do NOT raise this without a Postgres
  # backend (docs/POSTGRES_BACKEND.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kp.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the (non-secret) config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kp.fullname" . }}
            - secretRef:
                name: {{ include "kp.secretName" . }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kp.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
