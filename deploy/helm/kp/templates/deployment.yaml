apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kp.fullname" . }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
spec:
  # HARD single replica + Recreate: SQLite is single-writer on a RWO volume, so a
  # rolling update (two pods briefly) would contend for one DB file. Recreate stops
  # the old pod before starting the new one. Do NOT raise this without a Postgres
  # backend (docs/architecture/postgres-backend.md).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kp.selectorLabels" . | nindent 8 }}
      annotations:
        # Roll the pod when the (non-secret) config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        # ...and when the credentials change. envFrom.secretRef is read ONCE at
        # container start, so `helm upgrade --set auth.secret=<new>` updated the
        # Secret object, left the running pod holding the old value and reported
        # success — a rotation that appears to have happened, after which the
        # operator retires the old credential. Only the chart-rendered Secret can
        # be hashed; with existingSecret the chart renders none (see the note in
        # docs/architecture/self-hosting.md on rotating a pre-created Secret).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # Pod identity: an account with no Role attached, and no API token mounted.
      # kp talks to no Kubernetes API; the default account's projected token would
      # be a live cluster credential sitting next to the candidate data.
      serviceAccountName: {{ include "kp.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "kp.fullname" . }}
            - secretRef:
                name: {{ include "kp.secretName" . }}
          {{- with .Values.startupProbe }}
          # While this passes, the kubelet suppresses liveness and readiness — a
          # slow first boot (schema + seed) is not a wedged process.
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "kp.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
