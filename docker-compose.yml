# KP self-host — the app + its Python pipeline in one container, SQLite on a
# named volume so your data (all candidate PII) stays on your host, in your region.
#
#   cp .env.example .env      # then set KP_OPERATOR_PASSWORD + KP_SECRET (required)
#   docker compose up -d --build
#
# Full guide, egress inventory and air-gap notes: docs/architecture/self-hosting.md.
services:
  kp:
    build:
      context: .
      dockerfile: Dockerfile
    image: kp:local
    restart: unless-stopped
    ports:
      - "${KP_PORT:-3000}:3000"
    # Your keys/secrets come from .env (gitignored). Provider keys are OPTIONAL —
    # omit them to run with no external AI egress (deterministic fallbacks).
    env_file:
      - .env
    environment:
      # DB lives on the volume below, not in the image layer.
      KP_DB_PATH: /data/kp.sqlite
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      # Demo data. Unset (the default), a fresh volume boots EMPTY and the first
      # visit asks "start empty, or explore with demo data?" — the answer is stored
      # in the database, so it is asked once. Set KP_SEED_DEMO=1 to seed the demo
      # corpus at boot with no question (an unattended demo box); KP_EMPTY=1 forces
      # a blank tenant and skips the question. A volume that already holds data is
      # never wiped or re-seeded either way.
      # KP_SEED_DEMO: "1"
    volumes:
      - kp-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  kp-data:
