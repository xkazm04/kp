# .ai/manifest.yaml - the agent-facing contract for this repo (ai-manifest spec; the
# capability blocks can be added later - unknown/missing fields are ignored by readers).
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-22"

repo:
  name: kp
  purpose: "A self-hostable hiring workspace: screening behind human approval gates, work samples, voice interviews"

# WHICH GUIDANCE FILE FIRST. Three files in this repo carry agent instructions and
# they do agree, but only in prose: AGENTS.md says the full guide is
# .claude/CLAUDE.md, and CLAUDE.md reached it through an `@AGENTS.md` include — a
# two-hop path that lands a tool which does not expand includes on the shortest of
# the three. This block is the machine-readable answer, so nothing has to guess.
#
#   canonical    the ONE file to load. Every convention that bites lives here.
#   projections  the other guidance files. Each must exist and must NAME the
#                canonical path, so a reader that starts at one can reach it.
#   verify       the commands that verify a change. THE ONE THING THE THREE FILES
#                MUST SAY IDENTICALLY, and until this list existed nothing
#                compared them: every other rule reads one file at a time, so
#                renaming the unit-test script in the canonical file and landing
#                the new name in package.json left AGENTS.md telling an agent to
#                run the old one with all three files internally consistent and
#                the whole check green. They did not disagree about anything a
#                per-file rule could see — they just answered "how do I verify a
#                change" differently, and whichever file the agent opened decided
#                which answer it got. Each entry must exist in package.json AND
#                be named by every file above (an `@include` counts — CLAUDE.md
#                reaches these through one).
#
#                It is deliberately the SHORT list. Not every command in the
#                canonical file belongs here; these are the ones a projection is
#                wrong to be silent about, because they are what an agent runs
#                before it says it is done.
#
# Kept honest by `npm run guidance:check` (scripts/docs/check-guidance.mjs), which
# runs in ci.yml's node-quality job on every push and PR: it fails on a canonical
# that does not exist, a projection that never names it, an undeclared fourth
# guidance file, any `npm run <script>` these files tell an agent to run that
# package.json no longer defines, any verify command below that package.json or
# one of these files has stopped naming, and any drift between `gates` below and
# the steps .github/workflows/ci.yml actually runs.
#   gates        EVERY npm script .github/workflows/ci.yml runs. `verify` above is
#                the short list an agent runs before saying it is done; this is
#                the list that decides whether the push lands green, and until it
#                existed the two were different sets with nothing comparing them.
#                ci.yml grew to two dozen steps — design:check, docs:check,
#                release:check, six fixture suites, three ratchets — while all
#                three guidance files went on naming three commands, and every
#                rule above stayed green because each of them reads guidance
#                against guidance. An agent that followed the canonical document
#                to the letter still discovered half the pipeline from a red build.
#
#                Compared IN BOTH DIRECTIONS against the workflow, so this cannot
#                decay into a copy nobody re-reads: a step added to ci.yml that is
#                not here fails as `gate-unlisted`, an entry ci.yml no longer runs
#                fails as `gate-stale`. Each must exist in package.json.
#   gates_doc    the ONE declared guidance file that carries the gate table, and
#                that must name every entry in `gates`. Exactly one, unlike
#                `verify`: three commands repeated in three files is a contract,
#                two dozen repeated in three files is a guarantee of drift. Named
#                here rather than assumed so moving the table is a one-line edit.
guidance:
  canonical: .claude/CLAUDE.md
  projections:
    - AGENTS.md
    - CLAUDE.md
  verify:
    - typecheck
    - test:unit
    - lint
  gates_doc: AGENTS.md
  # In ci.yml's own order: node-quality first, then python-gate. The two gates
  # that read the COMMIT RANGE rather than the tree (doc-sync, commit-convention)
  # are not npm scripts and are not listed here; AGENTS.md names them in prose
  # beside the table.
  gates:
    - typecheck
    - lint
    - lint:ts-ratchet
    - design:check
    - i18n:check
    - docs:check
    - guidance:check
    - api:check
    - deploy:check
    - release:check
    - test:release
    - sbom
    - test:docs
    - test:skills
    - test:review
    - test:agent
    - test:lint-ratchet
    - test:perf
    - test:deploy
    - review:gate
    - security:actions
    - security:secrets
    - test:security
    - hooks:check
    - test:bench-driver
    - test:flake
    - test:unit
    - build
    - lint:ruff-ratchet
    - test:python:gate
    - test:eval:ci

# GUIDANCE THAT ARRIVES WITH THE SCOPE.
#
# `guidance.canonical` above answers "which file first". It does not answer "which
# of its rules bind the files in front of me", and that question got harder as this
# tree grew: `map` below splits it into 143 contexts across 17 groups, and the
# canonical document is written for the repository as a whole. An agent handed one
# context (10-22 files) inherits every global rule and has to infer which apply.
# Most do not - the `db.transaction()` rules mean nothing in a design-system
# context, the dual-theme rules mean nothing in a store module.
#
#   map          the context/group split. Generated; a snapshot, and it drifts.
#   constraints  the per-scope constraint record. Keyed by PATH GLOB, not by
#                context id, precisely because `map` is a generated snapshot -
#                constraints keyed to its `file_paths` would go stale on a rename
#                rather than on a change of rule. Paths are what a loader holds
#                when an agent opens a file.
#
# HOW A LOADER USES IT: given a file path, resolve every zone in `constraints`
# whose `paths` match and prepend its `constraints` array to the agent's context.
# Zones run general -> specific and a file may match several; all of it applies.
#
# Two fields in that file carry the weight. `enforced_by` separates a constraint a
# gate will catch from one only a reviewer will (`prose` means nothing runs).
# `status` plus the `coverage` block make "nobody wrote this down" distinguishable
# from "there is nothing to write" - a path matched only by the `repo-wide` zone
# has ASSUMED guidance, and `coverage.assumed` names the areas knowingly in that
# state. That distinction is the point of the file: before it, a context with no
# written rules and a context whose rules were merely never stated looked identical.
contexts:
  map: context-map.json
  constraints: context-constraints.json

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [recruiting, software-engineering, localization]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-skills.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - i18n-translate
  - onboarding
  - perfect
  - project-populate
  - scan-sweep
  - ship-loop
  - spark
  - tiger
  - uat
  - value-ledger

# Scope - what this project does and deliberately does not do. Read by the registry's
# scripts/build-fleet-map.mjs to classify subjects this project has NO context for: an
# absence inside an out-of-scope category or subject is never proposed as a new direction;
# every other in-domain absence is a `candidate` for the intake direction pass. Keys are
# `<bundle>/<category>[/<subcategory>]` and `<bundle>/<subject>`. Decisions on proposed
# directions live in .ai/directions/ledger.jsonl. DRAFT written by the registry on
# 2026-09-02 from the purpose line and the project note - the owner edits this block, the
# registry only reads it.
scope:
  does:
    - screening behind human approval gates, work samples, voice interviews
    - self-hostable (Docker), multi-locale, one organisation per install
  does_not:
    - agent fleets or companions
    - game, media, civic domains
    - an observability product
  out_of_scope_categories:
    - software-engineering/llm-agent/companion
    - software-engineering/llm-agent/orchestration
    - software-engineering/engineering-assessment
  out_of_scope_subjects:
  directions_ledger: .ai/directions/ledger.jsonl
