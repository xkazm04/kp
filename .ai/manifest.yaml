# .ai/manifest.yaml - the agent-facing contract for this repo (ai-manifest spec; the
# capability blocks can be added later - unknown/missing fields are ignored by readers).
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-22"

repo:
  name: kp
  purpose: "A self-hostable hiring workspace: screening behind human approval gates, work samples, voice interviews"

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [recruiting, software-engineering, localization]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-skills.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - i18n-translate
  - onboarding
  - perfect
  - project-populate
  - scan-sweep
  - ship-loop
  - spark
