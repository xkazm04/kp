  KP installer wizard — a shell, deliberately.

  All behaviour is in core.js (one state machine, one SSE reader, one set of
  card logic) and the whole look is wizard.css. The three-variant switcher this
  page carried through v0.3 is gone: Guide won, Spark's left rail came with it,
  and a prototyping rig kept past its verdict is just dead weight to read.

  Every file here is local and dependency-free: no build step, no npm packages,
