# Supply-chain and static-analysis gates.
#
# SECURITY.md states this app handles candidate CVs, contact details and
# interview transcripts. Until this file existed, the automated enforcement
# behind that duty of care was: nothing. CVE discovery was a human reading an
# advisory feed (the `next` 16.3.3 critical-RCE bump, 9ccdea4, was caught that
# way), and no SAST had ever read app/api/** or pipeline/jobfit/**.
#
# What runs, when, and what failure means:
#
#   codeql          every push + PR + Monday 04:17 UTC. Findings land in the
#                   repository Security tab. A NEW alert on a PR fails the
#                   check; the fix is to fix the code or dismiss the alert
#                   with a reason in the Security tab (not to edit this file).
#   npm-audit       every push + PR. Fails on a CRITICAL advisory in the npm
#                   tree. High/moderate are printed to the job summary but do
#                   not block — they are triaged via the Dependabot PR stream
#                   (.github/dependabot.yml).
#   pip-audit       every push + PR. Audits the RESOLVED python environment
#                   (requirements.txt is fully pinned), so transitive pins are
#                   covered too. Any advisory fails.
#
# Least privilege: this workflow's default token is read-only. Only the CodeQL
# job widens it, and only to `security-events: write`, which is the single
# permission needed to upload a SARIF result.
name: Security

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against an unchanged tree is still
    # found. Off the hour to avoid the top-of-hour scheduling queue.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload the SARIF result
      actions: read # read workflow run metadata for the analysis
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PINNING NOTE: every other action in this repository is pinned to a full
      # commit SHA (see ci.yml's header). The three codeql-action steps below
      # are pinned to the `v3` MAJOR TAG instead, because the author of this
      # file had no network access to verify a SHA against the GitHub API and
      # inventing one would simply break the workflow. Dependabot's
      # github-actions ecosystem is configured in .github/dependabot.yml and
      # will propose the SHA rewrite on its next run; take it.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      # No build step. `next build` needs Python codegen and 20+ minutes of
      # compile; CodeQL's javascript-typescript extractor reads source directly
      # and does not need the bundle. Python is likewise source-extracted.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  npm-audit:
    name: npm audit (fails on critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # `npm audit` reads package-lock.json and queries the registry advisory
      # API — it needs no install, so this job stays under a minute.
      - name: Report every advisory (non-blocking)
        run: |
          {
            echo '### npm audit'
            echo
            echo '```'
            npm audit --audit-level=low || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The blocking line is CRITICAL. Rationale: a critical npm advisory in
      # this tree has historically meant unauthenticated RCE against the
      # server that holds the CV database — there is no triage conversation to
      # have. High and below ride the Dependabot PR stream instead of stopping
      # everyone's build on a transitive with no published fix.
      #
      # When this trips: bump the dependency. Do NOT relax the level, and do
      # not add `--omit=dev` to make it quiet — dev tooling runs on the same
      # machine as the checkout.
      - name: Fail on a critical advisory
        run: npm audit --audit-level=critical

  pip-audit:
    name: pip-audit (jobfit pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Audit the RESOLVED environment rather than the requirements file: the
      # file is fully pinned (see its header) but its transitive closure is
      # not, and google-genai/anthropic/openai pull a wide tree.
      #
      # pip-audit is itself version-pinned so a new release cannot turn this
      # red without a deliberate bump — the same discipline ruff==0.15.0 gets
      # in ci.yml.
      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Audit installed packages
        run: pip-audit --strict --progress-spinner off
