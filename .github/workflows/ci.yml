# First CI for this repo: Node quality gates + the gated Python suite.
#
# Playwright e2e (`npm run test:e2e`) is DELIBERATELY excluded — decision on
# record: the e2e smoke needs runtime keys (live LLM providers) that we do not
# put in CI. Wiring a deterministic, key-free e2e subset is a follow-up.
#
# Action versions are pinned to full commit SHAs (verified against the GitHub
# API on 2026-07-02); the trailing comment names the tag each SHA resolves.
name: CI

on:
  push:
  pull_request:

# A force-push or rapid push train shouldn't queue stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, unit tests, production build.
  # NOTE: this job needs Python too — `npm run typecheck` and `npm run build`
  # both run `python -m pipeline.jobfit.codegen` (schemas:gen) before tsc/next,
  # and the codegen imports the pipeline package (pydantic et al.), so
  # requirements.txt must be installed in THIS job, not just in python-gate.
  node-quality:
    name: Node quality (typecheck, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pipeline dependencies (needed by schemas:gen)
        run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # matches the verified local toolchain (v24.14, LTS)
          cache: npm

      - run: npm ci

      # Standard Next.js CI cache: compiler artifacts keyed on the lockfile,
      # refreshed when source changes (restore-keys falls back to the newest
      # cache for the same lockfile).
      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run typecheck

      - run: npm run lint

      # Dual-theme design law (docs/design/README.md): brand.ts <-> globals.css
      # lockstep + a dark value for every shade utility used outside app/landing/.
      # The third gate (no raw hex / inline rgba) is an eslint rule, so it rides
      # `npm run lint` above. Until this step existed, nothing in CI had ever
      # read app/globals.css.
      - run: npm run design:check

      # Locale parity + hardcoded-string sweep (scripts/i18n-check.mjs): key
      # parity across all catalogs, attribute literals in shared primitives,
      # and English API-error leaks. Sub-second static read, same tier as
      # design:check above.
      - run: npm run i18n:check

      - run: npm run test:unit

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Gated Python unittest suite (pipeline/jobfit/tests/run_gated.py): fails when
  # the skip count exceeds the baseline, so a critical test can't silently stop
  # running. No `npm ci` needed — the script only shells out to python.
  python-gate:
    name: Python gated suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Ruff lint over the pipeline package. The rule set lives in ruff.toml
      # (repo root) — a RATCHET config verified green against the current tree,
      # with each ignored rule documented as debt to burn down; see the file
      # before widening it. Version-pinned so a new ruff release can't turn
      # this red without a deliberate bump.
      - name: Ruff (pipeline/)
        run: |
          pip install ruff==0.15.0
          ruff check pipeline/

      - name: Run gated Python suite
        run: npm run test:python:gate
        env:
          # Expected skips in keyless CI — derivation (must total exactly this):
          #   +1 test_claude_cli.LiveSmokeTest.test_real_cli_pong
          #      (gated on KP_CLAUDE_CLI_LIVE=1, which CI never sets)
          #   +2 test_pdf_parsing_quality pypdf tests on the personal CV fixtures
          #      (linkedin-profile.pdf / technical-cv.pdf are intentionally not in the repo)
          #   +1 test_pdf_parsing_quality.test_gemini_pdf_extraction_returns_structured_skills
          #      (needs that fixture AND a GEMINI_API_KEY — CI has neither)
          #   +0 test_llm_base.GeminiAdapterTest (its google-genai skip does NOT
          #      fire: requirements.txt installs the SDK)
          #   +1 test_interview_eval.TestGroundedBridge (the grounded DB-fixture
          #      bridge spawns node + better-sqlite3; this Python-only job
          #      installs no node_modules)
          #   = 5. The gate trips on skips > 5, so any NEW skip fails the build.
          # Bump deliberately (with a derivation edit) when adding a tolerated skip.
          KP_SKIP_BASELINE: "5"

  # Deterministic, KEY-FREE e2e subset — the follow-up the header note promised.
  # Runs only the specs that need no live LLM/provider keys (modal-escape,
  # profile-builder, and the journey specs as they land) against a real
  # production build: `next build` + the standalone server, assembled exactly
  # the way the Dockerfile assembles the runtime image. The full smoke
  # (`npm run test:e2e`, analyze-smoke et al.) stays deliberately out of CI.
  e2e-deterministic:
    name: E2E deterministic (chromium, keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Python is needed twice: `npm run build` runs schemas:gen (pipeline
      # codegen), and the running server SPAWNS `python -m pipeline.jobfit.*`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # output:"standalone" means `next start` is not supported — assemble the
      # runtime the same way the Dockerfile does (server + static + public +
      # the spawned python pipeline and its data next to server.js, which
      # chdirs to its own directory on boot).
      - name: Assemble standalone runtime (mirrors Dockerfile)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r pipeline .next/standalone/pipeline
          cp -r data .next/standalone/data

      # Keyless by design: no provider env is set, so the run certifies the
      # degraded-gracefully product property. Open dev mode (no
      # KP_OPERATOR_PASSWORD) + boot-time fixture seeding give the specs a
      # deterministic seeded tenant on a fresh DB.
      - name: Start production server (port 3101)
        run: |
          (PORT=3101 HOSTNAME=127.0.0.1 NEXT_TELEMETRY_DISABLED=1 node .next/standalone/server.js > server.log 2>&1 &)
          for i in $(seq 1 45); do
            curl -sf http://localhost:3101/ > /dev/null && exit 0
            sleep 2
          done
          echo "server never became ready" >&2
          tail -50 server.log >&2
          exit 1

      # CI is blanked for this one step: playwright.config.ts gates
      # reuseExistingServer on !process.env.CI, and blanking it makes the
      # config adopt the production server started above instead of spawning
      # its own `next dev`. Drop this override once the config grows an
      # env-driven baseURL/webServer switch (in flight). The positional args
      # are playwright file FILTERS — `journey` matches the journey specs as
      # they land and filters to nothing until then.
      - name: Run deterministic specs
        run: npx playwright test modal-escape profile-builder journey --project=chromium
        env:
          CI: ""

      - name: Server log on failure
        if: failure()
        run: tail -100 server.log || true
