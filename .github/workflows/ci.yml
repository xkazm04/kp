# First CI for this repo: Node quality gates + the gated Python suite.
#
# Playwright e2e (`npm run test:e2e`) is DELIBERATELY excluded — decision on
# record: the e2e smoke needs runtime keys (live LLM providers) that we do not
# put in CI. Wiring a deterministic, key-free e2e subset is a follow-up.
#
# Action versions are pinned to full commit SHAs (verified against the GitHub
# API on 2026-07-02); the trailing comment names the tag each SHA resolves.
name: CI

on:
  push:
  pull_request:

# Least privilege for GITHUB_TOKEN. Without this block GitHub hands every job
# the repository default, which on many repos is write-all: a compromised
# postinstall script in any transitive dependency would then be running with a
# token that can push to main. Nothing in this workflow writes anything — it
# reads the tree, compiles it and runs tests — so `contents: read` is the whole
# requirement. Add a narrower per-JOB `permissions:` if a future job needs more;
# never widen it here.
permissions:
  contents: read

# A force-push or rapid push train shouldn't queue stale runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Typecheck, lint, unit tests, production build.
  # NOTE: this job needs Python too — `npm run typecheck` and `npm run build`
  # both run `python -m pipeline.jobfit.codegen` (schemas:gen) before tsc/next,
  # and the codegen imports the pipeline package (pydantic et al.), so
  # requirements.txt must be installed in THIS job, not just in python-gate.
  node-quality:
    name: Node quality (typecheck, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pipeline dependencies (needed by schemas:gen)
        run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24 # matches the verified local toolchain (v24.14, LTS)
          cache: npm

      - run: npm ci

      # Standard Next.js CI cache: compiler artifacts keyed on the lockfile,
      # refreshed when source changes (restore-keys falls back to the newest
      # cache for the same lockfile).
      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - run: npm run typecheck

      - run: npm run lint

      # Dual-theme design law (docs/design/README.md): brand.ts <-> globals.css
      # lockstep + a dark value for every shade utility used outside app/landing/.
      # The third gate (no raw hex / inline rgba) is an eslint rule, so it rides
      # `npm run lint` above. Until this step existed, nothing in CI had ever
      # read app/globals.css.
      - run: npm run design:check

      # Locale parity + hardcoded-string sweep (scripts/i18n-check.mjs): key
      # parity across all catalogs, attribute literals in shared primitives,
      # and English API-error leaks. Sub-second static read, same tier as
      # design:check above.
      - run: npm run i18n:check

      # Decision-record integrity (docs/architecture/decisions/): every ADR's
      # `sources:` path must still exist and the index must agree with the
      # records. An ADR that names a moved file reads as current and sends the
      # next agent to a path that is gone — the same drift class that forced the
      # docs/ reorganisation, caught mechanically this time.
      - run: npm run docs:check

      # Guidance-manifest integrity (.ai/manifest.yaml `guidance:`). This repo
      # ships three agent-guidance files; the manifest names which one is
      # canonical so a tool never has to rank them. This fails when the canonical
      # file moved, when a projection stopped naming it (the two-hop `@include`
      # path breaks for readers that do not expand includes), when a FOURTH
      # guidance file arrives undeclared, or when the guidance tells an agent to
      # run an npm script package.json no longer defines.
      - run: npm run guidance:check

      # Release coherence: package.json <-> the chart's appVersion <-> a
      # CHANGELOG section for the current version. Runs on EVERY push, not only
      # on a tag, so the three cannot drift apart between releases — an operator
      # who pins the chart's appVersion must be getting the version whose notes
      # they read. See docs/architecture/releases.md.
      - run: npm run release:check

      - run: npm run test:release

      # The SBOM generator, end to end, on a push rather than only on a tag.
      # It reads package-lock.json AND the pip environment installed above, and
      # refuses to write a document that lists suspiciously little — so if a
      # lockfile format change or a missing interpreter breaks it, that surfaces
      # here rather than in the middle of cutting a release. The output is a
      # throwaway (dist/ is gitignored); the exit code is the point.
      - run: npm run sbom

      # Fixtures for both doc scripts (the doc-sync hook and the ADR gate).
      # They are .mjs under scripts/, so `npm run test:unit`'s app/**/*.test.ts
      # glob never saw them — the hook that guards doc drift was itself ungated.
      - run: npm run test:docs

      # Fixtures for the review lenses (scripts/review/). Kept next to the other
      # .mjs fixtures for the same reason: the tools that judge changes have to
      # be judged by something too.
      - run: npm run test:review

      # Fixtures for the DISPATCH path (scripts/agent/). This is the one piece of
      # the review machinery that writes rather than reads, from text a stranger
      # can put in an issue — so its guard (who may dispatch, what may never be
      # written) is gated here rather than trusted. The last case in the file
      # asserts every review lens, hook and workflow in the tree is still inside a
      # protected prefix, which is what catches a lens being moved out from under
      # the guard.
      - run: npm run test:agent

      # IS THE GATE STILL WIRED TO WHAT IT CLAIMS TO GATE?
      #
      # .github/rulesets/main.json is the required-status-check configuration —
      # the thing that turns a red workflow into a blocked merge. It names checks
      # by their job `name:`, which means a rename here silently un-gates them:
      # GitHub goes on waiting for a check nothing reports, and the fix someone
      # reaches for under pressure is to drop the requirement.
      #
      # WHEN IT FAILS: a required context no longer matches a job, or a review
      # lens left the required set. Fix the name, or update the ruleset in the
      # same change. Offline, sub-second, no token.
      - run: npm run review:gate

      # Supply chain: every workflow scopes GITHUB_TOKEN, and no NEW action rides
      # a mutable tag. A ratchet over the refs that already float (enumerated in
      # scripts/security/check-actions.mjs) — the list can only shrink.
      - run: npm run security:actions

      # The local half of the gate: .githooks/pre-push is the only thing between a
      # direct push to main and CI, and most changes here land that way. This
      # fails when a hook points at an npm script or a file that no longer exists
      # — the shape of drift that leaves the hook running and no longer checking.
      - run: npm run hooks:check

      # The App-master bench driver's own tests (scripts/app-master-bench/*.test.mjs).
      # They are dependency-free node:test files that were never in CI: the harness
      # that measures whether an agent can be trusted with this repo was itself
      # unmeasured. Includes gate.test.mjs, which pins the committed bench baseline
      # to the committed scenarios.
      - run: npm run test:bench-driver

      - run: npm run test:unit

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Doc-sync over the CHANGE, not over the agent transcript.
  #
  # scripts/docs/check-doc-sync.mjs is a Stop hook: it reads one agent session's
  # transcript on one machine. A human commit, a Dependabot PR, a different tool,
  # or an agent that simply dismissed the reminder all land with the coupled doc
  # untouched and nothing notices. This job applies the same pure rule to the git
  # range, which is what makes the obligation checkable instead of trusted.
  #
  # WHEN IT FAILS: update the named doc, or state the exemption in a commit body
  # as `Doc-sync: internal-only — <why>`. The dismissal is a line a reviewer can
  # read and disagree with, not a suppression flag.
  doc-sync:
    name: Doc sync (changed source vs coupled doc)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Need real history: the check diffs against the PR base (or HEAD~1 on
          # a push). A shallow clone would degrade every run to "no comparable
          # base" and the gate would pass vacuously.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # No `npm ci` — the script is dependency-free node:* + git.
      # The base ref reaches the script through `env:`, not through `${{ }}` in
      # the `run:` text — a ref name is event data, and event data substituted
      # into a shell line is executed by it (`npm run security:actions`).
      - name: Check doc sync over the range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE="HEAD~1"
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="origin/$PR_BASE_REF"; fi
          node scripts/docs/check-doc-sync-diff.mjs --base "$BASE" --head HEAD

  # Conventional-commit subjects over the CHANGE.
  #
  # scripts/release/prepare.mjs cuts every CHANGELOG section from these subject
  # lines, so a message that loses its `type:` prefix does not fail anything
  # today — it lands under "Other" and drops out of the release note an operator
  # reads to decide whether to upgrade. `.githooks/commit-msg` catches it while
  # the message is being written, but a hook only binds the machine that
  # installed it; this job is what makes the convention a check rather than a
  # habit, for forks, bots and any tool that writes a commit.
  #
  # WHEN IT FAILS: amend the subject (`git commit --amend`), or state the
  # exemption in the commit body as `Commit-convention-exemption: <why>`.
  commit-convention:
    name: Commit convention (subjects the changelog is cut from)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Real history, same reason as doc-sync: the check reads the commits
          # in the range, and a shallow clone would narrow it to nothing.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # No `npm ci` — the script is dependency-free node:* + git.
      - name: Check the subjects in this range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          BASE="HEAD~1"
          if [ "$EVENT_NAME" = "pull_request" ]; then BASE="origin/$PR_BASE_REF"; fi
          node scripts/release/commit-msg.mjs --base "$BASE" --head HEAD

  # Gated Python unittest suite (pipeline/jobfit/tests/run_gated.py): fails when
  # the skip count exceeds the baseline, so a critical test can't silently stop
  # running. No `npm ci` needed — the script only shells out to python.
  python-gate:
    name: Python gated suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Ruff lint over the pipeline package. The rule set lives in ruff.toml
      # (repo root) — a RATCHET config verified green against the current tree,
      # with each ignored rule documented as debt to burn down; see the file
      # before widening it. Version-pinned so a new ruff release can't turn
      # this red without a deliberate bump.
      - name: Ruff (pipeline/)
        run: |
          pip install ruff==0.15.0
          ruff check pipeline/

      - name: Run gated Python suite
        run: npm run test:python:gate
        env:
          # Expected skips in keyless CI — derivation (must total exactly this):
          #   +1 test_claude_cli.LiveSmokeTest.test_real_cli_pong
          #      (gated on KP_CLAUDE_CLI_LIVE=1, which CI never sets)
          #   +2 test_pdf_parsing_quality pypdf tests on the personal CV fixtures
          #      (linkedin-profile.pdf / technical-cv.pdf are intentionally not in the repo)
          #   +1 test_pdf_parsing_quality.test_gemini_pdf_extraction_returns_structured_skills
          #      (needs that fixture AND a GEMINI_API_KEY — CI has neither)
          #   +0 test_llm_base.GeminiAdapterTest (its google-genai skip does NOT
          #      fire: requirements.txt installs the SDK)
          #   +1 test_interview_eval.TestGroundedBridge (the grounded DB-fixture
          #      bridge spawns node + better-sqlite3; this Python-only job
          #      installs no node_modules)
          #   = 5. The gate trips on skips > 5, so any NEW skip fails the build.
          # Bump deliberately (with a derivation edit) when adding a tolerated skip.
          KP_SKIP_BASELINE: "5"

      # AI-BEHAVIOUR EVALS AS A GATE, not as something someone remembers to run.
      #
      # Only the two suites that are DETERMINISTIC AND KEYLESS are gated here —
      # a red result from either is always a real regression, never a provider
      # having a bad day:
      #
      #   matching_eval --strict     needs no API key by construction (its
      #     header says so): synthetic profiles routed and matched against the
      #     committed job corpus. It also carries the FAIRNESS probes — pedigree
      #     exclusion, socioeconomic inclusion, language neutrality, potential
      #     monotonicity — which is the part of this product that most deserves
      #     a gate rather than a periodic look.
      #
      #   automation_eval --no-llm --strict   the deterministic-fallback path:
      #     every automation task's keyless answer plus the hard reliability
      #     invariants (screening never auto-rejects an early-career candidate,
      #     rejection text carries no protected-characteristic language). This
      #     also certifies ADR 0004 — keyless degradation is a product property.
      #
      # Deliberately NOT gated: `test:eval:strict` (the Gemini golden set) and
      # `bench:app-master` (needs a live server + Personas). Those stay
      # on-demand; the bench's verdict is kept honest by `npm run bench:gate`
      # against scripts/app-master-bench/baseline.json instead.
      #
      # Cost: both are pure-Python over committed fixtures, in the job that has
      # already paid for the dependency install.
      - name: Deterministic AI-behaviour evals (keyless, strict)
        run: npm run test:eval:ci

  # Deterministic, KEY-FREE e2e subset — the follow-up the header note promised.
  # Runs only the specs that need no live LLM/provider keys (modal-escape,
  # profile-builder, and the journey specs as they land) against a real
  # production build: `next build` + the standalone server, assembled exactly
  # the way the Dockerfile assembles the runtime image. The full smoke
  # (`npm run test:e2e`, analyze-smoke et al.) stays deliberately out of CI.
  e2e-deterministic:
    name: E2E deterministic (chromium, keyless)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Python is needed twice: `npm run build` runs schemas:gen (pipeline
      # codegen), and the running server SPAWNS `python -m pipeline.jobfit.*`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*.ts', 'app/**/*.tsx', 'app/**/*.css') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # output:"standalone" means `next start` is not supported — assemble the
      # runtime the same way the Dockerfile does (server + static + public +
      # the spawned python pipeline and its data next to server.js, which
      # chdirs to its own directory on boot).
      - name: Assemble standalone runtime (mirrors Dockerfile)
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp -r pipeline .next/standalone/pipeline
          cp -r data .next/standalone/data

      # Keyless by design: no provider env is set, so the run certifies the
      # degraded-gracefully product property. Open dev mode (no
      # KP_OPERATOR_PASSWORD) + boot-time fixture seeding give the specs a
      # deterministic seeded tenant on a fresh DB.
      # KP_ALLOW_OPEN=1 is REQUIRED here: a production build FAILS CLOSED
      # without KP_OPERATOR_PASSWORD (proxy.ts), and the boot curl below
      # would read the refusal redirect as ready.
      - name: Start production server (port 3101)
        run: |
          (PORT=3101 HOSTNAME=127.0.0.1 KP_ALLOW_OPEN=1 NEXT_TELEMETRY_DISABLED=1 node .next/standalone/server.js > server.log 2>&1 &)
          for i in $(seq 1 45); do
            curl -sf http://localhost:3101/ > /dev/null && exit 0
            sleep 2
          done
          echo "server never became ready" >&2
          tail -50 server.log >&2
          exit 1

      # KP_E2E_BASE_URL points the suite at the production server started
      # above and skips the config's webServer block entirely (the
      # env-driven override in playwright.config.ts). The positional args
      # are playwright file FILTERS.
      #
      # Named one by one rather than by the `journey` prefix they share: this
      # job is the release gate, and a filter that silently widens as files are
      # added is how a slow or key-needing spec ends up in the keyless subset
      # without anyone deciding to put it there. Adding a spec here is the
      # decision. Both journeys are keyless by construction — see each file's
      # header for which endpoint on its path degrades deterministically.
      - name: Run deterministic specs
        run: >-
          npx playwright test
          modal-escape
          profile-builder
          journey-role-to-schedule
          journey-one-thread
          --project=chromium
        env:
          KP_E2E_BASE_URL: http://localhost:3101

      - name: Server log on failure
        if: failure()
        run: tail -100 server.log || true
