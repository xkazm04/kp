# Turn a green tag into an artifact an operator can pin to — and go back from.
#
# THE GAP THIS CLOSES: CI was green and led nowhere. A self-hoster's only option
# was to pin a git SHA and read `git log` to learn what it contained; there was
# no versioned artifact, no release notes, and no written rollback story. An
# agent had no safe path to drive a deploy either.
#
# TRIGGER: pushing a `v*` tag, and nothing else. Cut one with
# `node scripts/release/prepare.mjs --version x.y.z` (see
# docs/architecture/releases.md).
#
# WHAT RUNS, IN ORDER, AND WHAT FAILURE MEANS:
#   gate      the full verification gate, again, on the tagged commit. A tag
#             NEVER publishes something CI has not judged — even though the same
#             commit passed on main, the tag is the thing being certified.
#   publish   builds the image and pushes it to GHCR as x.y.z and sha-<commit>,
#             plus `latest` ONLY when the version is a plain semver — a
#             pre-release (v0.2.0-rc1) never moves the tag an operator gets by
#             pinning nothing. Then it attaches a build-provenance attestation so
#             `gh attestation verify` can prove where the image came from, and a
#             BuildKit SPDX SBOM attestation of the image's own filesystem.
#             If this fails, nothing is published and no release exists.
#   release   packages the Helm chart and creates the GitHub Release, with the
#             body taken from this version's CHANGELOG.md section and the
#             CycloneDX SBOM attached as an asset. A tag whose version has no
#             CHANGELOG section fails here rather than shipping an empty release
#             note.
#
# WHY THE SBOM IS CUT IN `gate` AND NOT IN `release`: it lists BOTH runtimes, and
# the Python half is read from the resolved environment (`pip list`) rather than
# from requirements.txt, which pins direct dependencies only and would omit every
# transitive — the packages an advisory is most often about. `gate` is the job
# that has already installed both toolchains.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Gate the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tag must agree with the tree it points at. `git tag v0.3.0` on a
      # commit whose package.json still says 0.2.0 would publish an image tagged
      # with a version the app does not believe it is.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            echo "Cut releases with scripts/release/prepare.mjs; see docs/architecture/releases.md." >&2
            exit 1
          fi

      # package.json <-> Chart.yaml appVersion <-> a CHANGELOG section.
      - run: npm run release:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run design:check
      - run: npm run i18n:check
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm run test:review
      - run: npm run test:agent
      - run: npm run test:bench-driver
      - run: npm run test:unit
      - run: npm run test:python:gate
        env:
          KP_SKIP_BASELINE: "5"
      - run: npm run test:eval:ci

      # The bill of materials for what this tag ships. Both halves of the
      # runtime: the lockfile's production closure and the resolved Python
      # environment installed above. The script REFUSES to write a document that
      # lists suspiciously little (scripts/release/sbom.mjs, checkSbom) — an
      # empty SBOM published as if complete is worse than no SBOM, because the
      # operator triaging a CVE would read "not affected" from an omission.
      #
      # `--timestamp` is the TAGGED COMMIT's own commit time, not the clock this
      # job happens to run on. Everything else in the document is already
      # content-derived (sorted components, a serial number hashed from them),
      # so the clock was the only reason re-running this job produced a
      # different file for the same tag — and "re-cut it and compare" is exactly
      # how an operator checks that the SBOM attached to a release describes the
      # tree it claims to.
      - name: Generate the SBOM (CycloneDX)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          node scripts/release/sbom.mjs \
            --out "dist/sbom/kp-${VERSION}.cdx.json" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --timestamp "$(git log -1 --format=%cI "$GITHUB_SHA")" \
            --image "$IMAGE"

      # Pinned to a major tag for the reason recorded in the publish job below.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: dist/sbom/*.json
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the image to GHCR
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # mint the OIDC token the attestation is signed with
      attestations: write # record the provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PINNING NOTE — and this is the workflow where it costs the most. These
      # steps run with `packages: write`, `id-token: write` and
      # `attestations: write`: they build the image an operator pins to, push it
      # to GHCR and sign a provenance attestation for it. A mutable tag here is a
      # pointer someone else can move into that.
      #
      # They are on major tags because the author of this file had no network
      # access to verify a SHA against the GitHub API, and inventing one breaks
      # the workflow. Dependabot will NOT fix this — it updates a reference in the
      # form it finds it, so a tag pin just becomes a newer tag pin. Close it with
      # `npm run security:actions -- --resolve`, then delete the matching
      # PIN_ALLOWLIST entries in scripts/security/check-actions.mjs. Until then
      # that ratchet at least stops a NEW unpinned action arriving beside them.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what an operator gets when they pin nothing, and this step
      # used to move it on EVERY tag. Cutting v0.2.0-rc1 to try a candidate on a
      # staging cluster would have re-pointed `latest` at a release candidate for
      # everyone who never asked for one. The predicate is prepare.mjs's
      # `releaseKind` (fixture-covered, fail-closed on anything unparseable), not
      # a shell pattern that would have to be got right here and in `release`.
      - name: Compute tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          PRERELEASE=$(node scripts/release/prepare.mjs --prerelease-of "$VERSION")
          # `sha-<commit>` is the immutable one: a semver tag can in principle
          # be re-pointed by a re-release, this never is.
          TAGS="$IMAGE:$VERSION,$IMAGE:sha-${GITHUB_SHA}"
          if [ "$PRERELEASE" = "false" ]; then
            TAGS="$TAGS,$IMAGE:latest"
          else
            echo "$VERSION is a pre-release — publishing the image without the :latest tag."
          fi
          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            echo "prerelease=$PRERELEASE"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Not multi-arch: the image ships Node 24 AND a Python pipeline, and
          # only linux/amd64 is verified. Publishing an unverified arm64 layer
          # would be a claim we cannot back.
          platforms: linux/amd64
          provenance: true
          # BuildKit's own SPDX scan of the built filesystem, pushed to the
          # registry as an attestation beside the provenance one. It answers a
          # different question from the CycloneDX document attached to the
          # release: this one describes the IMAGE as built (including the base
          # OS packages), that one describes the dependency closure the tree
          # declares. An operator triaging a CVE usually wants both.
          #   docker buildx imagetools inspect <image> --format '{{ json .SBOM }}'
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Lets anyone run `gh attestation verify oci://<image> --repo <repo>` and
      # prove the image was built from this repository at this commit.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SBOM cut in `gate`, from the tree and the environment that job
      # certified. Same pinning note as the actions in `publish`.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: dist/sbom

      # The release body is the CHANGELOG section for this version, extracted
      # verbatim. If there is no section, this FAILS — shipping a release with
      # empty notes is the failure this whole workflow exists to prevent.
      - name: Extract the release notes
        env:
          # Through `env:`, not into the script text. A job output is only as
          # trusted as the step that wrote it, and this one is the release note
          # of a signed image (`npm run security:actions` enforces the shape).
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "**Container image:** \`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`"
            echo "(immutable: \`ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}\`, digest \`${IMAGE_DIGEST}\`)"
            echo
            echo "Verify provenance: \`gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION} --repo ${GITHUB_REPOSITORY}\`"
            echo
            echo "**Bill of materials:** \`kp-${VERSION}.cdx.json\` below (CycloneDX 1.5 — npm production closure + the resolved Python environment)."
            echo "The image also carries a BuildKit SPDX attestation: \`docker buildx imagetools inspect ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION} --format '{{ json .SBOM }}'\`"
            echo
            echo "Upgrade and rollback: [docs/architecture/releases.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/architecture/releases.md)"
          } >> RELEASE_NOTES.md

      - name: Package the Helm chart
        run: |
          helm package deploy/helm/kp --destination dist/
          ls -l dist/

      # A pre-release is marked as one here for the same reason it does not get
      # the `:latest` image tag: nobody should be upgraded into a candidate by
      # a tool that reads "the newest release". Through `env:`, never into the
      # script text — `npm run security:actions` enforces that shape.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IS_PRERELEASE: ${{ needs.publish.outputs.prerelease }}
        run: |
          FLAGS=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            FLAGS="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            $FLAGS \
            dist/*.tgz dist/sbom/*.json
