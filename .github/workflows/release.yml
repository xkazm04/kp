# Turn a green tag into an artifact an operator can pin to — and go back from.
#
# THE GAP THIS CLOSES: CI was green and led nowhere. A self-hoster's only option
# was to pin a git SHA and read `git log` to learn what it contained; there was
# no versioned artifact, no release notes, and no written rollback story. An
# agent had no safe path to drive a deploy either.
#
# TRIGGER: pushing a `v*` tag, and nothing else. Cut one with
# `node scripts/release/prepare.mjs --version x.y.z` (see
# docs/architecture/releases.md).
#
# WHAT RUNS, IN ORDER, AND WHAT FAILURE MEANS:
#   gate      the full verification gate, again, on the tagged commit. A tag
#             NEVER publishes something CI has not judged — even though the same
#             commit passed on main, the tag is the thing being certified.
#   publish   builds the image and pushes it to GHCR as x.y.z, sha-<commit> and
#             latest, then attaches a build-provenance attestation so
#             `gh attestation verify` can prove where the image came from.
#             If this fails, nothing is published and no release exists.
#   release   packages the Helm chart and creates the GitHub Release, with the
#             body taken from this version's CHANGELOG.md section. A tag whose
#             version has no CHANGELOG section fails here rather than shipping
#             an empty release note.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  gate:
    name: Gate the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The tag must agree with the tree it points at. `git tag v0.3.0` on a
      # commit whose package.json still says 0.2.0 would publish an image tagged
      # with a version the app does not believe it is.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json version $PKG" >&2
            echo "Cut releases with scripts/release/prepare.mjs; see docs/architecture/releases.md." >&2
            exit 1
          fi

      # package.json <-> Chart.yaml appVersion <-> a CHANGELOG section.
      - run: npm run release:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run design:check
      - run: npm run i18n:check
      - run: npm run docs:check
      - run: npm run test:docs
      - run: npm run test:review
      - run: npm run test:bench-driver
      - run: npm run test:unit
      - run: npm run test:python:gate
        env:
          KP_SKIP_BASELINE: "5"
      - run: npm run test:eval:ci

  publish:
    name: Publish the image to GHCR
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # mint the OIDC token the attestation is signed with
      attestations: write # record the provenance attestation
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PINNING NOTE: as in security.yml, these three actions are pinned to
      # major tags rather than commit SHAs because the author of this file had
      # no network access to verify a SHA against the GitHub API, and inventing
      # one breaks the workflow. Dependabot's github-actions ecosystem
      # (.github/dependabot.yml) will propose the SHA rewrite; take it.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "image=$IMAGE"
            echo "version=$VERSION"
            # `sha-<commit>` is the immutable one: a semver tag can in principle
            # be re-pointed by a re-release, this never is.
            echo "tags=$IMAGE:$VERSION,$IMAGE:sha-${GITHUB_SHA},$IMAGE:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Not multi-arch: the image ships Node 24 AND a Python pipeline, and
          # only linux/amd64 is verified. Publishing an unverified arm64 layer
          # would be a claim we cannot back.
          platforms: linux/amd64
          provenance: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      # Lets anyone run `gh attestation verify oci://<image> --repo <repo>` and
      # prove the image was built from this repository at this commit.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: Create the GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release body is the CHANGELOG section for this version, extracted
      # verbatim. If there is no section, this FAILS — shipping a release with
      # empty notes is the failure this whole workflow exists to prevent.
      - name: Extract the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab = 1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "**Container image:** \`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`"
            echo "(immutable: \`ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}\`, digest \`${{ needs.publish.outputs.digest }}\`)"
            echo
            echo "Verify provenance: \`gh attestation verify oci://ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION} --repo ${GITHUB_REPOSITORY}\`"
            echo
            echo "Upgrade and rollback: [docs/architecture/releases.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/architecture/releases.md)"
          } >> RELEASE_NOTES.md

      - name: Package the Helm chart
        run: |
          helm package deploy/helm/kp --destination dist/
          ls -l dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            dist/*.tgz
